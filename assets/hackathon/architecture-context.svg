<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cortex MCP-first evidence context architecture</title><desc id="desc">Synthetic provider-shaped fixtures flow through Cortex's local demo path. The intended durable shape has an MCP proxy and control plane over a typed API, canonical Postgres, and a derived hosted Qdrant index.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#eaf2ff}.label{font-size:24px;font-weight:700}.small{font-size:17px;fill:#b7c6dd}.title{font-size:45px;font-weight:700}.pill{font-size:15px;font-weight:700;letter-spacing:1px}</style>
  <rect width="1600" height="900" fill="#081225"/><text x="90" y="90" class="title">Cortex — MCP-first evidence context</text><text x="90" y="126" class="small">Fixture walkthrough shown • durable architecture is intended, not a deployment claim</text>
  <rect x="75" y="195" width="270" height="420" rx="24" fill="#132445" stroke="#416aab"/><text x="105" y="250" class="label">Fixture corpus</text><g class="small"><text x="105" y="305">10 synthetic records</text><text x="105" y="345">6 source shapes</text><text x="105" y="385">3 media files</text><text x="105" y="425">2 captions + 1 transcript</text><text x="105" y="500">No live OAuth or</text><text x="105" y="528">provider connection</text></g><rect x="102" y="555" width="205" height="36" rx="18" fill="#ffcf5c"/><text x="124" y="579" class="pill" fill="#081225">NOT LIVE</text>
  <path d="M365 405H460" stroke="#75a7ff" stroke-width="8"/><path d="M440 385l30 20-30 20" fill="none" stroke="#75a7ff" stroke-width="8"/>
  <rect x="480" y="195" width="320" height="420" rx="24" fill="#16355a" stroke="#50b8d8"/><text x="512" y="250" class="label">Cortex typed API</text><g class="small"><text x="512" y="310">normalize + preserve</text><text x="512" y="350">cited evidence + gate</text><text x="512" y="390">workspace + access scope</text><text x="512" y="450">Postgres: canonical</text><text x="512" y="490">data + FTS</text><text x="512" y="550">Local fixture path only</text></g>
  <path d="M820 405H900" stroke="#75a7ff" stroke-width="8"/><path d="M880 385l30 20-30 20" fill="none" stroke="#75a7ff" stroke-width="8"/>
  <rect x="920" y="195" width="270" height="420" rx="24" fill="#1a4a54" stroke="#68d6b0"/><text x="950" y="250" class="label">Agent boundary</text><g class="small"><text x="950" y="310">MCP stdio proxy</text><text x="950" y="350">Codex / Claude / Cursor</text><text x="950" y="410">Local control plane</text><text x="950" y="450">evidence + health</text><text x="950" y="530">No native Claude</text><text x="950" y="558">session resume/fork</text></g>
  <path d="M1210 405H1285" stroke="#75a7ff" stroke-width="8"/><path d="M1265 385l30 20-30 20" fill="none" stroke="#75a7ff" stroke-width="8"/>
  <rect x="1305" y="195" width="220" height="420" rx="24" fill="#3a315d" stroke="#a58be8"/><text x="1335" y="250" class="label">Durable target</text><g class="small"><text x="1335" y="310">Hosted Qdrant</text><text x="1335" y="350">derived vector index</text><text x="1335" y="410">server-side filters</text><text x="1335" y="450">rebuildable from</text><text x="1335" y="478">canonical Postgres</text><text x="1335" y="550">INTENDED</text><text x="1335" y="578">NOT DEPLOYED HERE</text></g>
  <rect x="75" y="750" width="1450" height="58" rx="12" fill="#311d3e"/><text x="106" y="786" class="small">Demo proof: deterministic fixtures → evidence walkthrough → local MCP handoff. Not proof of production Qdrant, live providers, or customer data.</text>
</svg>
