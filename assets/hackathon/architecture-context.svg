<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cortex fixture demo architecture context</title><desc id="desc">Synthetic provider-shaped fixtures are normalized into evidence before retrieval produces an inspectable answer.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#eaf2ff}.label{font-size:25px;font-weight:700}.small{font-size:18px;fill:#b7c6dd}.title{font-size:48px;font-weight:700}.pill{font-size:16px;font-weight:700;letter-spacing:1px}</style>
  <rect width="1600" height="900" fill="#081225"/><text x="90" y="95" class="title">Cortex — evidence-first context flow</text><text x="90" y="132" class="small">Target architecture illustrated with deterministic synthetic fixtures • NOT LIVE</text>
  <rect x="90" y="205" width="320" height="490" rx="24" fill="#132445" stroke="#416aab"/><text x="125" y="260" class="label">Provider-shaped fixtures</text>
  <g class="small"><text x="130" y="315">Slack • 3</text><text x="130" y="365">Google Drive • 2</text><text x="130" y="415">Linear • 2</text><text x="130" y="465">GitHub / Jira / repo docs • 1 each</text><text x="130" y="535">3 media source files</text><text x="130" y="570">2 captions + 1 transcript</text></g><rect x="125" y="610" width="240" height="42" rx="21" fill="#ffcf5c"/><text x="152" y="637" class="pill" fill="#081225">10 SYNTHETIC RECORDS</text>
  <path d="M430 450H555" stroke="#75a7ff" stroke-width="8"/><path d="M535 430l30 20-30 20" fill="none" stroke="#75a7ff" stroke-width="8"/>
  <rect x="575" y="270" width="380" height="360" rx="24" fill="#16355a" stroke="#50b8d8"/><text x="615" y="330" class="label">Normalize &amp; preserve context</text><text x="615" y="385" class="small">source identity • fixture ID</text><text x="615" y="425" class="small">extracts • media derivatives</text><text x="615" y="465" class="small">chunks • provenance fields</text><text x="615" y="535" class="small">A target contract, not a live pipeline.</text>
  <path d="M975 450H1090" stroke="#75a7ff" stroke-width="8"/><path d="M1070 430l30 20-30 20" fill="none" stroke="#75a7ff" stroke-width="8"/>
  <rect x="1110" y="270" width="400" height="360" rx="24" fill="#1a4a54" stroke="#68d6b0"/><text x="1150" y="330" class="label">Retrieve &amp; inspect</text><text x="1150" y="385" class="small">cross-source question</text><text x="1150" y="425" class="small">answer + supporting excerpts</text><text x="1150" y="465" class="small">source label + fixture route</text><rect x="1150" y="525" width="295" height="48" rx="24" fill="#68d6b0"/><text x="1182" y="556" class="pill" fill="#081225">ANSWER WITH EVIDENCE</text>
  <rect x="90" y="770" width="1420" height="55" rx="12" fill="#311d3e"/><text x="122" y="805" class="small">Fixture boundary: no live provider APIs, customer workspaces, OAuth tokens, or production-index claims.</text>
</svg>
