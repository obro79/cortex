[project]
name = "cortex"
version = "0.1.0"
description = "Production-shaped Cortex backend skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.10",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "qdrant-client>=1.11,<2",
  "sqlalchemy[asyncio]>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
cortex = "cortex.cli.main:app"
cortex-worker = "cortex.workers.main:app"
cortex-mcp = "cortex.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cortex"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "opentelemetry.*"]
ignore_missing_imports = true
