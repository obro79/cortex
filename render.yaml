services:
  - type: web
    name: cortex-api-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn cortex.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: CORTEX_ENV
        value: staging
      - key: CORTEX_LOG_LEVEL
        value: INFO
      - key: CORTEX_STATE_BACKEND
        value: memory
      - key: CORTEX_EVENT_BUS
        value: memory
      - key: CORTEX_DEV_WORKBENCH_ENABLED
        value: "false"
