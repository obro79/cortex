services:
  api:
    build: .
    command: uvicorn cortex.api.app:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env.example
    environment:
      CORTEX_EVENT_BUS: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYLOAD_STORE_PATH: /var/lib/cortex/payloads
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - kafka
      - qdrant
      - minio
    volumes:
      - payload-data:/var/lib/cortex/payloads

  worker:
    build: .
    command: cortex-worker --role pipeline
    env_file: .env.example
    environment:
      CORTEX_EVENT_BUS: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYLOAD_STORE_PATH: /var/lib/cortex/payloads
    depends_on:
      - postgres
      - kafka
    volumes:
      - payload-data:/var/lib/cortex/payloads

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  payload-data:
