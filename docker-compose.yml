services:
  api:
    build:
      context: .
      target: api
    command: uvicorn cortex.api.app:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env.example
    environment:
      CORTEX_EVENT_BUS: kafka
      CORTEX_STATE_BACKEND: sql
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYLOAD_STORE_PATH: /var/lib/cortex/payloads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - payload-data:/var/lib/cortex/payloads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    command: cortex-worker --role pipeline
    env_file: .env.example
    environment:
      CORTEX_EVENT_BUS: kafka
      CORTEX_STATE_BACKEND: sql
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYLOAD_STORE_PATH: /var/lib/cortex/payloads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - payload-data:/var/lib/cortex/payloads

  worker-lifecycle:
    build:
      context: .
      target: worker
    command: cortex-worker --role lifecycle
    profiles: ["lifecycle"]
    env_file: .env.example
    environment:
      CORTEX_STATE_BACKEND: sql
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
      PAYLOAD_STORE_PATH: /var/lib/cortex/payloads
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - payload-data:/var/lib/cortex/payloads

  migrate:
    build:
      context: .
      target: api
    command: alembic upgrade head
    profiles: ["migrate"]
    env_file: .env.example
    environment:
      CORTEX_STATE_BACKEND: sql
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  payload-data:
