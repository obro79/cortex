services:
  api:
    build: .
    command: uvicorn cortex.api.app:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redpanda
      - qdrant
      - minio

  worker:
    build: .
    command: cortex-worker --role noop
    env_file: .env.example
    depends_on:
      - postgres
      - redpanda

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  minio-data:
